{% extends "base.html" %}

{% block content %}
<div class="row" style="justify-content: center;">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">Edit Trek</div>
            <div class="card-body">
                <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Trek Name</label>
                        <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select" name="difficulty" required>
                                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Total Slots</label>
                            <input type="number" class="form-control" name="slots" value="{{ trek.slots }}" min="1" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" name="status" required>
                            <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                            <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Update Trek</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline mt-2 w-100" style="text-align:center; display:block; margin-top:10px;">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
