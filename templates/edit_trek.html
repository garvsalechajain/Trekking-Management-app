{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Edit Trek: {{ trek.name }}</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn">Cancel</a>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form action="/trek/edit/{{ trek.id }}" method="POST">
        <label for="name">Trek Name</label>
        <input type="text" id="name" name="name" value="{{ trek.name }}" required>
        
        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ trek.location }}" required>
        
        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty" required>
            <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            <option value="Expert" {% if trek.difficulty == 'Expert' %}selected{% endif %}>Expert</option>
        </select>
        
        <label for="slots">Total Slots</label>
        <input type="number" id="slots" name="slots" min="1" value="{{ trek.slots }}" required>

        <label for="start_date">Start Date:</label>
        <input type="date" id="start_date" name="start_date" value="{{ trek.start_date }}" required>

        <label for="end_date">End Date:</label>
        <input type="date" id="end_date" name="end_date" value="{{ trek.end_date }}" required>
        
        <label for="status">Trek Status</label>
        <select id="status" name="status" required>
            <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
            <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
        </select>

        <label for="assigned_staff_id">Assigned Staff ID (Optional)</label>
        <input type="number" id="assigned_staff_id" name="assigned_staff_id" value="{{ trek.assigned_staff_id if trek.assigned_staff_id != None else '' }}">
        
        <button type="submit" style="width: 100%; margin-top: 1rem;">Save Changes</button>
    </form>
</div>
{% endblock %}
